<script type="text/javascript">
jQuery(document).ready(function(){
        jQuery('.titles').click(function(){
            jQuery('#event-organizer-window-sort-options').css({'opacity': '1' , 'pointer-events' : 'all'});
        var title_val = jQuery(this).attr('data');
        var tabs_content_attr = jQuery('.tabs-data').data('content');

        // console.log(title_val);
        // console.log(tabs_content_attr);

        if(title_val == 'title-1'){
            jQuery('.tabs-data').hide();
            jQuery('div#event-organizer-window-saved-on-my-pc').addClass('disabled');
            jQuery('[data-content="title-1"]').show();
        }

        if(title_val == 'title-2'){
            jQuery('.tabs-data').hide();
            jQuery('.titles').removeClass('disabled');
            jQuery('[data-content="title-2"]').show();
        }
        if(title_val == 'title-3'){
            jQuery('.tabs-data').hide();
            jQuery('[data-content="title-3"]').show();
        }
        if(title_val == 'title-4'){
            jQuery('.tabs-data').hide();
            jQuery('#event-organizer-window-sort-options').css({'opacity': '0' , 'pointer-events' : 'none'});
            jQuery('#event-organizer-window .sorts-options').removeClass('dropdown-open')
            jQuery('[data-content="title-4"]').show();
        }
        });


        jQuery(document).on('click' , 'span#event-organizer-window-show-thambnail' , function(){

            jQuery(this).toggleClass('checked');
            jQuery('table.geTemplate_main').toggleClass('hide-thambnail');

        })

            jQuery( '#event-organizer-window-sort-options' ).mouseover(function() {
            jQuery(this).addClass('dropdown-open');
              })
              .mouseout(function() {
                jQuery(this).removeClass('dropdown-open');
                
              }); 

        jQuery('div#event-organizer-window-show-my-plans').click(function(){

            jQuery(this).toggleClass('checked');
            jQuery('table.geTemplate_main[data_myplans=""]').toggleClass('hideotherplans');

        })




})



</script>
