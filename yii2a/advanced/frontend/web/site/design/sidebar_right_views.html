<style>
.views {
	padding: 0 12px 8px 12px;
}

.views_sidebar .geFormatSection {
	border: 0 !important;
}

.views .views-row {
	position: relative;
	background-color: white;
	margin: 7px 0;
	border-radius: 4px;
	box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

.views .menu-wrapper {
	position: absolute;
	top: 10px;
	right: 10px;
} 

.views_sidebar {
	background-color: #f8f9fa;
}

.views .views-preview-container {
	height: 150px;
	border-bottom: 1px solid #dadce0;
	background-size: contain !important;
	background-repeat: no-repeat !important;
	background-position: center !important;
	background-origin: content-box !important;
	padding: 10px;
}
.views .view-name {
	padding: 12px;
}
.views .menu-container {
	position: relative;
	display: inline-block;
}

.views .menu-button {
	background-color: #f1f1f1;
	border: none;
	cursor: pointer;
	padding: 4px 10px;
	border-radius: 4px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}
.views .print .menu-button {
	background-color: #a8518a;
	color: white;
	padding: 5px 10px;
}
.views .views-search-img {
	position: absolute;
    top: 50%;
	left: 7px;
    transform: translate(0, -50%);
}
.views .menu-button .dots {
	width: 4px;
	height: 4px;
	background-color: #000;
	border-radius: 50%;
	margin: 1px 0;
}
.views .print .menu-button .dots {
	background-color: #fff;
}

.views .popup-menu {
	display: none;
	position: absolute;
	right: 0;
	background-color: #fff;
	box-shadow: 0 8px 16px rgba(0,0,0,0.2);
	z-index: 1;
	min-width: 160px;
	border-radius: 4px;
}

.views .menu-container.active .popup-menu {
    display: block;
}

.views .popup-menu a {
	color: black;
	padding: 12px 16px;
	text-decoration: none;
	display: block;
	cursor: default;
	text-align: center;
}

.views .popup-menu a:hover {
	background-color: #f1f1f1;
}

.views .search-views {
	font-size: 12px;
	overflow: hidden;
	box-sizing: border-box;
	border: solid 1px #d5d5d5;
	border-radius: 4px;
	width: 100%;
	outline: none;
	padding: 6px 6px 6px 22px;
}
.views .search-wrapper {
	position: relative;
	width: 65%;
	display: flex;
	align-items: center;
}
.views .views-toolbar {
	display: flex;
    justify-content: space-between;

}

.views .add-button {
	border-radius: 4px;
	cursor: pointer;
	font-size: 26px;
    line-height: 1;
    color: white;
	padding: 0 18px;
	background-color: #a8518a;
}
.views-checkbox-wrapper {
	position: absolute;
	left: 10px;
	top: 10px;
}
.views input[type="checkbox"] {
	visibility: hidden;
}
.views input[type="checkbox"]:checked + label:before {
    background-color: #88979a;
    color: #fff;
    text-align: center;
    background-image: url(icons/check-24px.svg);
    content: '';
    background-repeat: no-repeat;
    background-position: center;
    background-size: 10px;
}

.views input[type="checkbox"] + label:before {
	margin-left: -20px;
	cursor: pointer;
    border: 1px solid #ccc;
    content: "\00a0";
    display: inline-block;
    font: 16px / 1em sans-serif;
    height: 16px;
    padding: 0;
    vertical-align: top;
    width: 16px;
    border-radius: 3px;
    background-color: #f7f8f8;
}

.views .add-button.active {
	background-color: #470530;
}
</style>
